  <text x="750" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Sans KR">에러는 </tspan><tspan font-family="IBM Plex Mono">0%</tspan></text>
  <rect x="788" y="498" width="330" height="88" rx="12" fill="#17304a" stroke="#5ad1b4" stroke-width="1.5"/>
  <text x="806" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">구분점을 찍은 뒤</tspan></text>
  <text x="806" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">히트율 </tspan><tspan font-family="IBM Plex Mono">95%</tspan></text>
  <text x="1100" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Sans KR">비용 약 </tspan><tspan font-family="IBM Plex Mono">1/5</tspan></text>
