  <text x="122" y="240" font-weight="600" font-size="19" fill="#6c7f9e"><tspan font-family="IBM Plex Mono">L0</tspan></text>
  <text x="196" y="241" font-weight="600" font-size="22" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">활성화 프로브</tspan></text>
  <text x="1100" y="241" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Sans KR">오탐 감수 · 무작위 </tspan><tspan font-family="IBM Plex Mono">5%</tspan><tspan font-family="IBM Plex Sans KR">도 같이 넘긴다</tspan></text>
  <rect x="88" y="275" width="1032" height="55" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <rect x="102" y="289" width="4" height="27" rx="2" fill="#3b4d72"/>
  <text x="122" y="309" font-weight="600" font-size="19" fill="#6c7f9e"><tspan font-family="IBM Plex Mono">L1</tspan></text>
  <text x="196" y="310" font-weight="600" font-size="22" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">모델 기반 검토기</tspan></text>
  <text x="1100" y="310" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Sans KR">턴마다 · 검사 간격 </tspan><tspan font-family="IBM Plex Mono">30</tspan><tspan font-family="IBM Plex Sans KR">분 이내로</tspan></text>
