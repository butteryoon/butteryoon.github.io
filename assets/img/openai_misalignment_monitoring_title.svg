  <rect x="88" y="413" width="1032" height="55" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <rect x="102" y="427" width="4" height="27" rx="2" fill="#3b4d72"/>
  <text x="122" y="447" font-weight="600" font-size="19" fill="#6c7f9e"><tspan font-family="IBM Plex Mono">L3</tspan></text>
  <text x="196" y="448" font-weight="600" font-size="22" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">대화 밖 증거 대조</tspan></text>
  <text x="1100" y="448" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Sans KR">네트워크 로그·텔레메트리와 비교</tspan></text>
  <rect x="88" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="106" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Mono">Hugging Face </tspan><tspan font-family="IBM Plex Sans KR">사건 재현</tspan></text>
  <text x="106" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">약 </tspan><tspan font-family="IBM Plex Mono">30</tspan><tspan font-family="IBM Plex Sans KR">분</tspan></text>
  <text x="400" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Sans KR">탈출 </tspan><tspan font-family="IBM Plex Mono">→ </tspan><tspan font-family="IBM Plex Sans KR">경보</tspan></text>
  <rect x="438" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="456" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Mono">9</tspan><tspan font-family="IBM Plex Sans KR">월 학습 중 </tspan><tspan font-family="IBM Plex Mono">DNS </tspan><tspan font-family="IBM Plex Sans KR">우회</tspan></text>
  <text x="456" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">15</tspan><tspan font-family="IBM Plex Sans KR">분 안</tspan></text>
  <text x="750" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Sans KR">검토 +</tspan><tspan font-family="IBM Plex Mono">3</tspan><tspan font-family="IBM Plex Sans KR">분</tspan></text>
  <rect x="788" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="806" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">외부 레드팀 (</tspan><tspan font-family="IBM Plex Mono">METR · Redwood)</tspan></text>
  <text x="806" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">3</tspan><tspan font-family="IBM Plex Sans KR">주</tspan></text>
  <text x="1100" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Mono">2026-07</tspan></text>
