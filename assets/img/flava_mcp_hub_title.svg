  <rect x="102" y="427" width="4" height="27" rx="2" fill="#3b4d72"/>
  <text x="122" y="447" font-weight="600" font-size="19" fill="#6c7f9e"><tspan font-family="IBM Plex Mono">4</tspan><tspan font-family="IBM Plex Sans KR">층</tspan></text>
