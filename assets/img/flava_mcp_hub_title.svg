  <text x="1100" y="241" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Mono">MCP Connector </tspan><tspan font-family="IBM Plex Sans KR">— </tspan><tspan font-family="IBM Plex Mono">OIDC · </tspan><tspan font-family="IBM Plex Sans KR">토큰 캐시 · 갱신 · </tspan><tspan font-family="IBM Plex Mono">Bearer </tspan><tspan font-family="IBM Plex Sans KR">주입</tspan></text>
