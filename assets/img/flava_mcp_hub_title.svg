  <text x="106" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">650</tspan><tspan font-family="IBM Plex Sans KR">개 이상</tspan></text>
  <rect x="438" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="456" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">인증 준비 시간</tspan></text>
  <text x="456" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">1</tspan><tspan font-family="IBM Plex Sans KR">주일 </tspan><tspan font-family="IBM Plex Mono">→ 5</tspan><tspan font-family="IBM Plex Sans KR">분</tspan></text>
  <text x="750" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Sans KR">내부 추정</tspan></text>
