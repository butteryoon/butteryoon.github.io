<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a2e"/>
      <stop offset="55%" stop-color="#17233d"/>
      <stop offset="100%" stop-color="#241a38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ad1b4"/>
      <stop offset="100%" stop-color="#7aa8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="88" y="50" width="72" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="88" y="92" font-family="IBM Plex Mono" font-weight="500" font-size="22" letter-spacing="3" fill="#5ad1b4">CONTEXT ENGINEERING</text>
  <text x="1112" y="90" text-anchor="end" font-family="IBM Plex Mono" font-weight="400" font-size="21" fill="#6c7f9e">tech.kakao.com · 2026-10-28</text>
  <text x="88" y="140" font-weight="700" font-size="40" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">누가 분석하든 같은 규칙에서 출발하게 만든다</tspan></text>
  <text x="88" y="178" font-weight="400" font-size="23" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">개인별 </tspan><tspan font-family="IBM Plex Mono">CLAUDE.md </tspan><tspan font-family="IBM Plex Sans KR">를 팀 공통 지식베이스로 옮긴 </tspan><tspan font-family="IBM Plex Mono">3</tspan><tspan font-family="IBM Plex Sans KR">층 컨텍스트</tspan></text>
  <rect x="88" y="206" width="1032" height="78" rx="12" fill="#17304a" stroke="#5ad1b4" stroke-width="1.5"/>
  <rect x="102" y="220" width="4" height="50" rx="2" fill="#5ad1b4"/>
  <text x="122" y="252" font-weight="600" font-size="19" fill="#5ad1b4"><tspan font-family="IBM Plex Mono">What</tspan></text>
  <text x="196" y="253" font-weight="600" font-size="22" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">Data Catalog</tspan></text>
  <text x="1100" y="253" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Sans KR">무엇을 어떤 기준으로 집계하는가 — </tspan><tspan font-family="IBM Plex Mono">Git</tspan></text>
  <rect x="88" y="298" width="1032" height="78" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <rect x="102" y="312" width="4" height="50" rx="2" fill="#3b4d72"/>
  <text x="122" y="344" font-weight="600" font-size="19" fill="#6c7f9e"><tspan font-family="IBM Plex Mono">How</tspan></text>
  <text x="196" y="345" font-weight="600" font-size="22" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">Analyst Persona</tspan></text>
  <text x="1100" y="345" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Sans KR">어떻게 비교·검증하고 전달하는가 — </tspan><tspan font-family="IBM Plex Mono">Git</tspan></text>
  <rect x="88" y="390" width="1032" height="78" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <rect x="102" y="404" width="4" height="50" rx="2" fill="#3b4d72"/>
  <text x="122" y="436" font-weight="600" font-size="19" fill="#6c7f9e"><tspan font-family="IBM Plex Mono">Why</tspan></text>
  <text x="196" y="437" font-weight="600" font-size="22" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">Task Context</tspan></text>
  <text x="1100" y="437" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Sans KR">왜 분석하며 무엇을 판단하는가 — </tspan><tspan font-family="IBM Plex Mono">Jira</tspan></text>
  <rect x="88" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="106" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">나뉜 컨텍스트</tspan></text>
  <text x="106" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">3</tspan><tspan font-family="IBM Plex Sans KR">층</tspan></text>
  <text x="400" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Mono">What·How·Why</tspan></text>
  <rect x="438" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="456" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">두는 곳</tspan></text>
  <text x="456" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">Git 2 · Jira 1</tspan></text>
  <rect x="788" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="806" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">사람의 일이 옮겨 간 곳</tspan></text>
  <text x="806" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">추출 </tspan><tspan font-family="IBM Plex Mono">→ </tspan><tspan font-family="IBM Plex Sans KR">판단</tspan></text>
</svg>
