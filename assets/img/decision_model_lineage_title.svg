<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a2e"/>
      <stop offset="55%" stop-color="#17233d"/>
      <stop offset="100%" stop-color="#241a38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ad1b4"/>
      <stop offset="100%" stop-color="#7aa8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="88" y="50" width="72" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="88" y="92" font-family="IBM Plex Mono" font-weight="500" font-size="22" letter-spacing="3" fill="#5ad1b4">DECISION MODELS</text>
  <text x="1112" y="90" font-weight="400" font-size="21" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Mono">2026.09 - 11</tspan></text>
  <text x="88" y="140" font-weight="700" font-size="40" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">속도보다 먼저 볼 것은 확률의 출처다</tspan></text>
  <text x="88" y="178" font-weight="400" font-size="23" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">결정 모델 다섯 편을 다시 읽는 세 축</tspan></text>
  <rect x="88" y="206" width="1032" height="78" rx="12" fill="#17304a" stroke="#5ad1b4" stroke-width="1.5"/>
  <rect x="102" y="220" width="4" height="50" rx="2" fill="#5ad1b4"/>
  <text x="122" y="252" font-weight="600" font-size="19" fill="#5ad1b4"><tspan font-family="IBM Plex Sans KR">축 </tspan><tspan font-family="IBM Plex Mono">1</tspan></text>
  <text x="196" y="253" font-weight="600" font-size="22" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">보정 기준점</tspan></text>
  <text x="1100" y="253" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Sans KR">실제 정답률에 맞춘 건 </tspan><tspan font-family="IBM Plex Mono">Kanana </tspan><tspan font-family="IBM Plex Sans KR">하나뿐</tspan></text>
  <rect x="88" y="298" width="1032" height="78" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <rect x="102" y="312" width="4" height="50" rx="2" fill="#3b4d72"/>
  <text x="122" y="344" font-weight="600" font-size="19" fill="#6c7f9e"><tspan font-family="IBM Plex Sans KR">축 </tspan><tspan font-family="IBM Plex Mono">2</tspan></text>
  <text x="196" y="345" font-weight="600" font-size="22" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">선택지 상한</tspan></text>
  <text x="1100" y="345" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Mono">255</tspan><tspan font-family="IBM Plex Sans KR">는 답 코드 개수에서 온 숫자다</tspan></text>
  <rect x="88" y="390" width="1032" height="78" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <rect x="102" y="404" width="4" height="50" rx="2" fill="#3b4d72"/>
  <text x="122" y="436" font-weight="600" font-size="19" fill="#6c7f9e"><tspan font-family="IBM Plex Sans KR">축 </tspan><tspan font-family="IBM Plex Mono">3</tspan></text>
  <text x="196" y="437" font-weight="600" font-size="22" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">지연 측정 경계</tspan></text>
  <text x="1100" y="437" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Sans KR">넷의 측정 범위가 서로 다르다</tspan></text>
  <rect x="88" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="106" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">묶어 읽은 글</tspan></text>
  <text x="106" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">5</tspan><tspan font-family="IBM Plex Sans KR">편</tspan></text>
  <text x="400" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Mono">9/28 → 11/12</tspan></text>
  <rect x="438" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="456" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Mono">JEV-27B </tspan><tspan font-family="IBM Plex Sans KR">— </tspan><tspan font-family="IBM Plex Mono">Jev </tspan><tspan font-family="IBM Plex Sans KR">분포와의 거리</tspan></text>
  <text x="456" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">KL 0.017</tspan></text>
  <rect x="788" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="806" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Mono">Kanana </tspan><tspan font-family="IBM Plex Sans KR">— 실제 정답률</tspan></text>
  <text x="806" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">ECE 1.12%</tspan></text>
  <text x="1100" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Mono">2.06 </tspan><tspan font-family="IBM Plex Sans KR">에서</tspan></text>
</svg>
