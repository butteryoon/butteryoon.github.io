<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15122A"/>
      <stop offset="60%" stop-color="#1B1836"/>
      <stop offset="100%" stop-color="#221C40"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="88" y="92" width="88" height="6" rx="3" fill="#A78BFA"/>
  <text x="88" y="158" font-family="IBM Plex Mono" font-weight="500" font-size="25" letter-spacing="3" fill="#A78BFA">PROMPT ASSEMBLY</text>
  <text x="1112" y="158" text-anchor="end" font-family="IBM Plex Mono" font-weight="400" font-size="21" fill="#7A7496">Codex → Claude</text>

  <text x="88" y="248" font-family="IBM Plex Sans KR" font-weight="700" font-size="50" fill="#F2F0F8">Codex의 캐시 미스는</text>
  <text x="88" y="312" font-family="IBM Plex Sans KR" font-weight="700" font-size="50" fill="#F2F0F8">Claude에서 400 에러다</text>

  <text x="88" y="368" font-family="IBM Plex Sans KR" font-weight="400" font-size="27" fill="#A29CBE">캐시 프리픽스 렌더 순서 — 툴 배열이 가장 앞에 온다</text>

  <g>
    <rect x="88" y="424" width="230" height="96" rx="12" fill="#2A2352" stroke="#5B4BA0" stroke-width="2"/>
    <text x="110" y="462" font-family="IBM Plex Mono" font-weight="600" font-size="21" fill="#C4B5FD">tools</text>
    <text x="110" y="496" font-family="IBM Plex Sans KR" font-weight="400" font-size="19" fill="#9B93BC">프리픽스 맨 앞</text>

    <text x="340" y="480" text-anchor="middle" font-family="IBM Plex Mono" font-weight="400" font-size="24" fill="#6B6490">→</text>

    <rect x="362" y="424" width="230" height="96" rx="12" fill="#1F1B3C" stroke="#3B3463" stroke-width="1.5"/>
    <text x="384" y="462" font-family="IBM Plex Mono" font-weight="600" font-size="21" fill="#9FA8D9">system</text>
    <text x="384" y="496" font-family="IBM Plex Sans KR" font-weight="400" font-size="19" fill="#86809F">최상위는 고정</text>

    <text x="614" y="480" text-anchor="middle" font-family="IBM Plex Mono" font-weight="400" font-size="24" fill="#6B6490">→</text>

    <rect x="636" y="424" width="250" height="96" rx="12" fill="#1F1B3C" stroke="#3B3463" stroke-width="1.5"/>
    <text x="658" y="462" font-family="IBM Plex Mono" font-weight="600" font-size="21" fill="#9FA8D9">messages</text>
    <text x="658" y="496" font-family="IBM Plex Sans KR" font-weight="400" font-size="19" fill="#86809F">append 만 허용</text>

    <rect x="916" y="424" width="196" height="96" rx="12" fill="#3A2318" stroke="#8A5230" stroke-width="1.5"/>
    <text x="938" y="466" font-family="IBM Plex Mono" font-weight="600" font-size="27" fill="#F0A868">400</text>
    <text x="938" y="499" font-family="IBM Plex Sans KR" font-weight="400" font-size="18" fill="#B88A64">프리픽스 검사 위반</text>
  </g>

  <text x="88" y="566" font-family="IBM Plex Sans KR" font-weight="400" font-size="19" fill="#625C80">append-only 는 권고가 아니라 요건이다 — Claude 5.1 이상</text>
</svg>
