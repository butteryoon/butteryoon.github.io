      <stop offset="100%" stop-color="#241a38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ad1b4"/>
      <stop offset="100%" stop-color="#7aa8ff"/>
