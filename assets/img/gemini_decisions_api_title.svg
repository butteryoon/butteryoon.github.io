<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a2e"/>
      <stop offset="55%" stop-color="#17233d"/>
      <stop offset="100%" stop-color="#241a38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ad1b4"/>
      <stop offset="100%" stop-color="#7aa8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="88" y="50" width="72" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="88" y="92" font-family="IBM Plex Mono" font-weight="500" font-size="22" letter-spacing="3" fill="#5ad1b4">DECISION MODEL</text>
  <text x="1112" y="90" font-weight="400" font-size="21" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Mono">Google · 2026-11-11</tspan></text>
  <text x="88" y="140" font-weight="700" font-size="40" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">한 입력에 질문 세 타입을 한꺼번에 붙인다</tspan></text>
  <text x="88" y="178" font-weight="400" font-size="23" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">생성 없이 후보를 채점해 확률로 돌려준다</tspan></text>
  <rect x="88" y="223" width="1032" height="68" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="110" y="266" font-weight="600" font-size="23" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">멀티모달 입력 한 덩어리</tspan></text>
  <text x="1098" y="266" font-weight="400" font-size="18" fill="#8ea4c6" text-anchor="end"><tspan font-family="IBM Plex Sans KR">텍스트·이미지·오디오·비디오·</tspan><tspan font-family="IBM Plex Mono">PDF, </tspan><tspan font-family="IBM Plex Sans KR">최대 </tspan><tspan font-family="IBM Plex Mono">256K </tspan><tspan font-family="IBM Plex Sans KR">토큰</tspan></text>
  <path d="M252 297 L252 302" stroke="#4d6490" stroke-width="1.6" fill="none"/>
  <path d="M252 311 l-5.5 -9 l11 0 z" fill="#4d6490"/>
  <rect x="88" y="317" width="328" height="136" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="108" y="353" font-weight="500" font-size="17" fill="#6c7f9e"><tspan font-family="IBM Plex Mono">noul</tspan></text>
  <text x="108" y="379" font-weight="600" font-size="23" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">yes/no</tspan></text>
  <text x="108" y="414" font-weight="400" font-size="17" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">조건이 성립할 확률</tspan></text>
  <path d="M604 297 L604 302" stroke="#4d6490" stroke-width="1.6" fill="none"/>
  <path d="M604 311 l-5.5 -9 l11 0 z" fill="#4d6490"/>
  <rect x="440" y="317" width="328" height="136" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="460" y="353" font-weight="500" font-size="17" fill="#6c7f9e"><tspan font-family="IBM Plex Mono">choice</tspan></text>
  <text x="460" y="379" font-weight="600" font-size="23" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">다중선택</tspan></text>
  <text x="460" y="414" font-weight="400" font-size="17" fill="#8ea4c6"><tspan font-family="IBM Plex Mono">2~255</tspan><tspan font-family="IBM Plex Sans KR">개 중 하나를 고른다</tspan></text>
  <path d="M956 297 L956 302" stroke="#4d6490" stroke-width="1.6" fill="none"/>
  <path d="M956 311 l-5.5 -9 l11 0 z" fill="#4d6490"/>
  <rect x="792" y="317" width="328" height="136" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="812" y="353" font-weight="500" font-size="17" fill="#6c7f9e"><tspan font-family="IBM Plex Mono">score</tspan></text>
  <text x="812" y="379" font-weight="600" font-size="23" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">순서형 루브릭</tspan></text>
  <text x="812" y="414" font-weight="400" font-size="17" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">가중 점수 + 등급별 확률</tspan></text>
  <rect x="88" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="106" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">엔드투엔드 지연</tspan></text>
  <text x="106" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">150-250ms</tspan></text>
  <rect x="438" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="456" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">입력 </tspan><tspan font-family="IBM Plex Mono">100</tspan><tspan font-family="IBM Plex Sans KR">만 토큰</tspan></text>
  <text x="456" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Sans KR">$</tspan><tspan font-family="IBM Plex Mono">0.10</tspan></text>
  <text x="750" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Sans KR">출력 $</tspan><tspan font-family="IBM Plex Mono">0</tspan></text>
  <rect x="788" y="498" width="330" height="88" rx="12" fill="#16223a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="806" y="530" font-weight="500" font-size="18" fill="#8ea4c6"><tspan font-family="IBM Plex Sans KR">한 요청 질문</tspan></text>
  <text x="806" y="568" font-weight="700" font-size="29" fill="#f2f5fb"><tspan font-family="IBM Plex Mono">1,000</tspan><tspan font-family="IBM Plex Sans KR">개</tspan></text>
  <text x="1100" y="568" font-weight="400" font-size="17" fill="#6c7f9e" text-anchor="end"><tspan font-family="IBM Plex Sans KR">지연 그대로</tspan></text>
</svg>
