{% assign ga = site.analytics %}
{% if ga and ga != '' and ga contains 'G-' %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ ga }}');
</script>
{% endif %} <!-- End Analytics -->
